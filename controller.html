<!doctype html><html lang="pa"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Punjab 7 TV Controller</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f7f7;font-family:Arial}.status{text-align:center;background:white;padding:9px;position:sticky;top:0}.wrap{max-width:800px;margin:auto;padding:12px}.card{background:white;border:1px solid #ddd;border-radius:7px;overflow:hidden;margin-bottom:14px}.teams{display:grid;grid-template-columns:1fr 1fr}.team{text-align:center;padding:15px;border-right:1px solid #ddd}.input{width:100%;padding:11px;font-size:18px;text-align:center;border:1px solid #ccc;border-radius:5px}.score{font-size:76px;font-weight:700;margin:15px}.buttons{display:flex;gap:12px;justify-content:center}.btn{border:0;color:white;border-radius:6px;width:120px;height:82px;font-size:40px}.plus{background:#06a63b}.minus{background:#eb0037}.body{padding:16px}.act{width:100%;border:0;color:white;border-radius:6px;padding:14px;margin:7px 0;font-size:21px}.blue{background:#087ff5}.green{background:#08ad43}.red{background:#ed173c}.field{margin:10px 0}.field label{display:block;font-weight:bold;margin-bottom:5px}.field input{width:100%;padding:11px;font-size:17px}.rad{display:flex;gap:25px;margin:14px 0;font-size:18px}@media(max-width:600px){.score{font-size:58px}.btn{width:100px;height:70px}}</style><div id="status">Connecting…</div><div class="wrap"><div class="card"><div class="teams"><div class="team"><b>Team 1</b><input id="ta" class="input"><div id="sa" class="score">1</div><div class="buttons"><button id="pa" class="btn plus">+</button><button id="ma" class="btn minus">−</button></div></div><div class="team"><b>Team 2</b><input id="tb" class="input"><div id="sb" class="score">1.5</div><div class="buttons"><button id="pb" class="btn plus">+</button><button id="mb" class="btn minus">−</button></div></div></div><div class="body"><div class="rad"><label><input type="radio" name="ss" value="true"> Show</label><label><in
